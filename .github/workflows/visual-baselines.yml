name: Visual baselines

on:
  workflow_dispatch:
    inputs:
      reason:
        description: Why baselines are being refreshed (included in the commit message)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: visual-baselines-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - name: Refresh visual snapshots
        run: npx playwright test --project=visual --update-snapshots=all
        env:
          CI: true

      - name: Commit baselines when tests/visual changed
        id: commit
        env:
          REASON: ${{ inputs.reason }}
          RUN_ID: ${{ github.run_id }}
          BASE_REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if ! git status --porcelain tests/visual | grep -q .; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes under tests/visual; nothing to commit." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          branch="visual-baselines/${RUN_ID}"
          git checkout -b "$branch"
          git add tests/visual
          git commit -m "Visual baselines: ${REASON}"

          git push origin "$branch"

          compare_url="https://github.com/${GITHUB_REPOSITORY}/compare/${BASE_REF}...${branch}"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "branch=${branch}" >> "$GITHUB_OUTPUT"
          echo "compare_url=${compare_url}" >> "$GITHUB_OUTPUT"

          {
            echo "### Visual baselines branch"
            echo ""
            echo "Pushed \`${branch}\` (base: \`${BASE_REF}\`)."
            echo ""
            echo "[Open compare view](${compare_url})"
          } >> "$GITHUB_STEP_SUMMARY"
